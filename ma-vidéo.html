<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Video</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 50px auto;
            padding: 20px;
            background-color: rgb(16, 16, 16);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: blue;
            font-size: 2em;
            position: absolute;
            width: 100%;
            top: 50%; /* Centrer verticalement */
            left: 50%; /* Centrer horizontalement */
            transform: translate(-50%, -50%); /* Centrage parfait */
            animation: slideUp 5s linear infinite; /* Animation pour le défilement de bas en haut */
        }

        /* Définir l'animation pour faire défiler le texte de bas en haut */
        @keyframes slideUp {
            0% {
                transform: translate(-50%, 100px); /* Commence en bas */
            }
            50% {
                transform: translate(-50%, -50px); /* Se déplace vers le haut */
            }
            100% {
                transform: translate(-50%, 100px); /* Retourne en bas */
            }
        }

        .video-container {
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }

        video {
            width: 20%; /* Prend toute la largeur du conteneur */
            max-width: 600px; /* Limite la largeur de la vidéo */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .back-link {
            margin-top: 30px;
        }

        .back-link a {
            color: white;
            background-color: blue;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .back-link a:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ma Video</h1>

    <div class="video-container">
        <!-- Balise pour lire la vidéo -->
        <video controls>
            <source src="ece513d702b195752924ed55f6d2a300.mp4" type="video/mp4">
            <source src="video.webm" type="video/webm">
            <source src="video.ogv" type="video/ogv">
            Votre navigateur ne supporte pas la lecture de cette vidéo.
        </video>
    </div>

    <!-- Lien retour à la page précédente -->
    <div class="back-link">
        <a href="ma-liste.html">Retour à la liste</a>
    </div>
</div>

</body>
</html>
